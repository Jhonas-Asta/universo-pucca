<!doctype html>
<html lang=es>

<head>
    <meta charset=utf-8>
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>pucca</title>
    <style>
        body,
        html {
            margin: 0;
            height: 100%;
            background: #090817;
            overflow: hidden
        }

        canvas {
            display: block
        }

        .player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 2px solid #f60;
            border-radius: 999px;
            background: 0 0;
            box-shadow: 0 0 15px #f60, 0 0 30px #f30;
            z-index: 1000;
            font-family: Arial, sans-serif;
            color: #fff;
            font-size: 14px
        }

        .player button {
            background: 0 0;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            filter: drop-shadow(0 0 6px #ff6600);
            transition: transform .2s
        }

        .player button:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px #ff3300)
        }

        .progress {
            flex-grow: 1;
            height: 14px;
            background: rgba(255, 255, 255, .12);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
            position: relative
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(270deg, #f60, #f30, #f09, #f60);
            background-size: 400% 400%;
            border-radius: 999px;
            box-shadow: 0 0 10px #f60;
            animation: flowing 6s ease infinite
        }

        @keyframes flowing {
            0% {
                background-position: 0 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0 50%
            }
        }

        .time {
            min-width: 74px;
            text-align: right;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 0 5px #f60
        }
    </style>
    <style>
        .player {
            border-color: #bba7ff;
            box-shadow: 0 0 15px #a78bfa, 0 0 30px #56d8e8;
        }

        .player button {
            filter: drop-shadow(0 0 6px #bba7ff);
        }

        .player button:hover {
            filter: drop-shadow(0 0 10px #56d8e8);
        }

        .progress-bar {
            background: linear-gradient(270deg, #a78bfa, #56d8e8, #ff91bd, #a78bfa);
            box-shadow: 0 0 10px #56d8e8;
        }

        .time {
            text-shadow: 0 0 5px #bba7ff;
        }
    </style>
</head>

            <div class=progress-bar id=progress-bar></div>
        </div>
        <div class=time id=time>0:00 / 0:00</div>
    </div>

    </audio>

    <script>
        const romanticImages = [
            "https://i.postimg.cc/xThBvr93/097645c888f4638dd3d13431019f1765.jpg",
            "https://i.postimg.cc/3JVzXM3C/304bff8269c7e1b909e0dac1708f1fcb.jpg",
            "https://i.postimg.cc/QxwvQLjq/d2d684143c0e1c4bbec277d0ddaeaf4c.jpg"
        ];
        const repeatedRomanticImages = Array.from({ length: 18 }, (_, index) => romanticImages[index % romanticImages.length]);
        const imageCards = [];
        const romanticImageLoader = new THREE.TextureLoader();
        romanticImageLoader.setCrossOrigin("anonymous");
        repeatedRomanticImages.forEach((url, index) => {
            romanticImageLoader.load(url, texture => {
                const ratio = texture.image.width / texture.image.height || 1;
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: .94,
                    depthTest: false
                }));
                sprite.scale.set(20 * ratio, 20, 1);
                sprite.renderOrder = 20;
                const anchor = textGroup.children[(index * 11) % textGroup.children.length];
                const offset = new THREE.Vector3(index % 2 ? -24 : 24, index % 3 ? 16 : -16, 0);
                imageCards.push({ sprite, anchor, offset });
                scene.add(sprite);
            });
        });
        function followRomanticImages() {
            imageCards.forEach(card => card.sprite.position.copy(card.anchor.position).add(card.offset));
            requestAnimationFrame(followRomanticImages);
        }
        followRomanticImages();
        scene.fog = new THREE.FogExp2(0x39265f, 0.0008);
    </script>
    <style>
        .player {
            background: rgba(18, 16, 43, .78);
            backdrop-filter: blur(12px);
        }

        .sound-hint {
            flex: 1;
            color: #f1eaff;
            font-size: 12px;
            text-align: center;
        }

        .tap-heart {
            position: fixed;
            z-index: 2000;
            pointer-events: none;
            color: #ff91bd;
            font-size: var(--size);
            text-shadow: 0 0 14px #a78bfa;
            animation: heart-rise 1.15s ease-out forwards;
        }

        @keyframes heart-rise {
            from {
                opacity: 1;
                transform: translate(-50%, 0) scale(.55) rotate(0deg);
            }

            to {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), -95px) scale(1.35) rotate(var(--turn));
            }
        }

        @media (max-width: 520px) {
            .player {
                width: calc(100% - 24px);
                gap: 7px;
                padding: 9px;
            }

            .sound-hint {
                font-size: 10px;
            }

            .time {
                min-width: 62px;
                font-size: 10px;
            }
        }
    </style>
    <script>
        (() => {
            const music = document.getElementById('audio');
            const hint = document.getElementById('sound-hint');
            let soundUnlocked = false;
            async function attemptAutoplay() {
                try {
                    music.muted = false;
                    await music.play();
                    soundUnlocked = true;
                    hint.hidden = true;
                } catch {
                    music.muted = true;
                    try { await music.play(); } catch { /* The file or browser may block playback. */ }
                    hint.hidden = false;
                }
            }
            attemptAutoplay();
            function unlockSound() {
                if (soundUnlocked) return;
                music.muted = false;
                music.play().then(() => {
                    soundUnlocked = true;
                    hint.hidden = true;
                }).catch(() => {
                    hint.textContent = 'Tu navegador bloqueó el audio automático';
                });
            }
            document.addEventListener('pointerdown', unlockSound);
            document.addEventListener('keydown', unlockSound);

            document.addEventListener('pointerdown', (event) => {
                const amount = 5;
                for (let i = 0; i < amount; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'tap-heart';
                    heart.textContent = i % 2 ? '♥' : '♡';
                    heart.style.left = `${event.clientX + (Math.random() - .5) * 36}px`;
                    heart.style.top = `${event.clientY + (Math.random() - .5) * 18}px`;
                    heart.style.setProperty('--dx', `${(Math.random() - .5) * 90}px`);
                    heart.style.setProperty('--turn', `${(Math.random() - .5) * 55}deg`);
                    heart.style.setProperty('--size', `${15 + Math.random() * 16}px`);
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1200);
                }
            });
        })();
    </script>
